  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  height: auto;

    &lt;h2 id=&quot;platform-inventory-heading&quot;&gt;Platform, languages, and third-party inventory&lt;/h2&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;Settings labeled current were verified on this workstation on 22 July 2026. They are mutable, gitignored local configuration—not repository defaults.&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;Layer&lt;/th&gt;&lt;th&gt;Languages + runtime&lt;/th&gt;&lt;th&gt;Third-party tools in this process&lt;/th&gt;&lt;th&gt;Responsibility / current mode&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;Pool client&lt;/td&gt;
            &lt;td&gt;TypeScript, TSX, CSS · browser ESM&lt;/td&gt;
            &lt;td&gt;React 18.2, ReactDOM, React Router, Lucide React, Inter variable font · Vite 4.5 build&lt;/td&gt;
            &lt;td&gt;Choose → Inspect → Library UI. Uses native File API, fetch, sessionStorage, and webkitdirectory. No React Flow, D3, ECharts, or external state library in the Add path.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Studio control plane&lt;/td&gt;
            &lt;td&gt;TypeScript ES2022 · CommonJS modules · Node&lt;/td&gt;
            &lt;td&gt;Express 4.22, better-sqlite3 11.10 in the standalone manifest, Node crypto/fs/path&lt;/td&gt;
            &lt;td&gt;Owns deterministic intake planning, review state, decisions, and the durable handoff ledger in &lt;code&gt;ingestion.db&lt;/code&gt;.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Web acquisition&lt;/td&gt;
            &lt;td&gt;TypeScript · Node workers/subprocesses · HTTP/HTML&lt;/td&gt;
            &lt;td&gt;Axios, Cheerio, Archiver, yauzl, Zod; guarded pdf-parse, Mammoth, SheetJS/xlsx, Turndown; shared provider layer for optional semantic ranking&lt;/td&gt;
            &lt;td&gt;Bounded crawling, SSRF/redirect controls, configurable robots policy, reviewed downloads, safe ZIP expansion, and parser isolation. Docling is deliberately disabled for untrusted scraped files.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Pool document plane&lt;/td&gt;
            &lt;td&gt;TypeScript ES2022 · CommonJS · Node 20 via ts-node + SWC · SQL&lt;/td&gt;
            &lt;td&gt;Express 4.18, better-sqlite3 9.4, SQLite FTS5&lt;/td&gt;
            &lt;td&gt;Canonical document rows in &lt;code&gt;contextos.db&lt;/code&gt;, search chunks/indexes, local vault files, library links, and event buses.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Local NLP workers&lt;/td&gt;
            &lt;td&gt;Python 3.12 · per-parse child process + persistent JSONL workers&lt;/td&gt;

            &lt;td&gt;Docling, spaCy, and fastembed are installed locally. Docling starts a short-lived parser per parse; spaCy/fastcoref and fastembed use persistent workers. First coreference use may download fastcoref. Fastembed is not automatic remote-call failover.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;AI provider layer&lt;/td&gt;
            &lt;td&gt;TypeScript provider adapters · HTTPS&lt;/td&gt;
            &lt;td&gt;OpenAI SDK, Anthropic SDK, Google Generative AI SDK; Mistral through the OpenAI-compatible adapter&lt;/td&gt;
            &lt;td&gt;Snapshot: active chat OpenAI &lt;code&gt;gpt-5-chat-latest&lt;/code&gt;; knowledge OpenAI &lt;code&gt;gpt-5.5&lt;/code&gt;; independent backup Mistral &lt;code&gt;mistral-small-latest&lt;/code&gt;. Structured calls try knowledge → chat → backup; individual substages can use narrower routes. Local Ollama is off.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Retrieval + vectors&lt;/td&gt;
            &lt;td&gt;TypeScript · SQL/FTS5 · normalized Float32 vectors&lt;/td&gt;

            &lt;td&gt;One embedding provider is resolved per request; a remote failure does not automatically switch to fastembed. Vectors are SQLite BLOBs compared with exact in-process cosine and fused with lexical ranks. No external vector database or ANN index is active.&lt;/td&gt;

  &lt;section class=&quot;card decision-watchpoints&quot; aria-labelledby=&quot;decision-watchpoints-heading&quot;&gt;
    &lt;h2 id=&quot;decision-watchpoints-heading&quot;&gt;Decision-critical watchpoints&lt;/h2&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Verified current state&lt;/th&gt;&lt;th&gt;Why it matters&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;UI mismatch&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Enforcement is 100 MiB total, but the dropzone copy still says 25 MB.&lt;/td&gt;&lt;td&gt;Users may under-estimate capacity; documentation and visible limits disagree with actual behavior.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Binary boundary&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Browser Add rejects PDF/Word and sends text JSON only. Smart-site files use guarded binary parsers; other collectors can use Docling.&lt;/td&gt;&lt;td&gt;The broad parser stack exists, but it is not exposed uniformly through this exact Add branch.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Draft durability&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Browser file bodies live in memory until preparation; sessionStorage preserves metadata and prepared backend batch IDs.&lt;/td&gt;&lt;td&gt;Closing the drawer is safe, but a page reload loses unprepared browser file contents.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Crawl depth contract&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The UI labels depth 1 as supplied pages only, while the crawler follows links whenever &lt;code&gt;level &amp;lt; depth&lt;/code&gt;; 10/20-page caps apply per seed URL.&lt;/td&gt;&lt;td&gt;Scope and load can exceed the user’s apparent selection. Product copy, crawler semantics, and aggregate caps need one contract.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Synthetic crawl fallback&lt;/span&gt;&lt;/td&gt;&lt;td&gt;When no direct page survives, the route creates a “Live scraper unavailable here” document and continues ingestion.&lt;/td&gt;&lt;td&gt;A network failure can become searchable synthetic content instead of an error; this can pollute knowledge and should be blocked or unmistakably quarantined.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Workspace symlink escape&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Directory symlinks are skipped, but a supported-extension file symlink can be stat/read outside &lt;code&gt;STUDIO_FS_ROOTS&lt;/code&gt;.&lt;/td&gt;&lt;td&gt;This is a local-file trust-boundary vulnerability and should be fixed before workspace-folder intake is treated as contained.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Intake residue&lt;/span&gt;&lt;/td&gt;&lt;td&gt;An exception during &lt;code&gt;startBatch&lt;/code&gt; returns HTTP 500 without a failed transition or cleanup, so inserted &lt;code&gt;running&lt;/code&gt; rows can remain.&lt;/td&gt;&lt;td&gt;Operators need stale-batch detection/repair; otherwise dashboards and retries can accumulate ambiguous control-plane state.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Runtime contract&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The active Pool server is pinned to Node 20, while the standalone ingestion-engine manifest declares Node ≥22 &amp;lt;23.&lt;/td&gt;&lt;td&gt;The embedded path works through the Pool runtime, but packaging or independent deployment needs an explicit supported-runtime decision.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Storage topology&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;ingestion.db&lt;/code&gt; owns Studio batches/jobs; &lt;code&gt;contextos.db&lt;/code&gt; plus the vault own searchable knowledge.&lt;/td&gt;&lt;td&gt;The adapter boundary is deliberate, but backup, migration, and recovery plans must cover both stores atomically enough for the product promise.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Semantic handoff&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The approved handoff transports source text, title, and origin. Studio classifications/clusters remain review-plan data and are not copied into Pool.&lt;/td&gt;&lt;td&gt;Pool performs its own later deep classification; decisions must not assume Studio grouping metadata becomes the canonical library organization.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Split state&lt;/span&gt;&lt;/td&gt;&lt;td&gt;A successful handoff is completed in job/item ledgers while the Studio batch itself remains &lt;code&gt;paused_review&lt;/code&gt;.&lt;/td&gt;&lt;td&gt;Operational dashboards must read handoff status, not infer completion from the batch state alone.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Review semantics&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Confidence, grouping, and &lt;code&gt;classificationFlagged&lt;/code&gt; are returned by the API but are not rendered or blocking in Pool; the UI cannot correct type/cluster.&lt;/td&gt;&lt;td&gt;The visible gate validates inclusion and title, not the semantic plan. Treat Studio classification as API-only advisory metadata.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Gate enforcement&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Review is required by the Pool UI, not by the commit API. Omitted &lt;code&gt;selectedSourceIds&lt;/code&gt; defaults to all sources, and hidden duplicates are preselected.&lt;/td&gt;&lt;td&gt;A direct or malformed client can bypass explicit human selection, and unseen duplicates can be linked. Server-side approval semantics need hardening.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Review edit durability&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Title/selection edits are tab-scoped sessionStorage, not durable server state.&lt;/td&gt;&lt;td&gt;The batch survives reload/restart, but unsent reviewer intent does not survive closing the tab/app; recovery UX must distinguish the two.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Duplicate identity&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Studio hashes exact raw text; Pool hashes normalized lowercase text with collapsed whitespace and punctuation removed.&lt;/td&gt;&lt;td&gt;A document can pass Studio dedupe and still be linked as an existing Pool document. This is intentional, but counts differ by layer.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Duplicate readiness&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The Pool adapter rejects an existing duplicate in &lt;code&gt;error&lt;/code&gt;, but currently allows &lt;code&gt;processing&lt;/code&gt; and can return &lt;code&gt;searchReady=false&lt;/code&gt; after linking it.&lt;/td&gt;&lt;td&gt;A successful link is not unconditional proof of immediate searchability. The implementation and its “healthy duplicate” comment should be reconciled.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Alternate path&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The normal Add flow does not call the legacy Studio tree commit (&lt;code&gt;synthesizeTree&lt;/code&gt;/&lt;code&gt;persistTree&lt;/code&gt;/&lt;code&gt;buildIndexes&lt;/code&gt;).&lt;/td&gt;&lt;td&gt;This graph maps the live Add → add-to-library path only; legacy tree output should not be included in current capability claims.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;External data egress&lt;/span&gt;&lt;/td&gt;&lt;td&gt;With local models off, deep enrichment—and optional smart-site candidate ranking—sends bounded source excerpts or batches to configured external providers. Secret-shaped values are redacted; general PII is not anonymized.&lt;/td&gt;&lt;td&gt;Provider use is a privacy/compliance decision, not just a cost decision. Sensitive-library policy needs an explicit local-only or consent boundary.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Enrichment restart gap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The deep-enrichment queue is memory-only. Restart loses waiting &lt;code&gt;fast_ready&lt;/code&gt; work; boot reclaim excludes that status and &lt;code&gt;autoResweep&lt;/code&gt; is off.&lt;/td&gt;&lt;td&gt;A searchable document can remain permanently shallow after restart without a durable queue, boot catch-up, or explicit repair job.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Intelligence signal&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;intelligence_ready&lt;/code&gt; emits after isolated extractor attempts even when one or more errors were swallowed; startup backfill covers only the fast catalog.&lt;/td&gt;&lt;td&gt;Consumers need per-extractor receipts rather than treating one event as proof of complete intelligence.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Recovery gap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;autoResweep=false&lt;/code&gt; returns before the sweeper reclaims documents stuck in &lt;code&gt;enriching&lt;/code&gt; for 45 minutes.&lt;/td&gt;&lt;td&gt;The configured stale-row recovery is currently inactive; operations need a manual recovery path or a deliberate re-sweep policy.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Timeout is not cancellation&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Refinement’s 90-second stage timeout abandons the awaited promise but does not cancel underlying provider/enrichment work.&lt;/td&gt;&lt;td&gt;Calls and spend can continue after the operation advances; timeout, cancellation, and cost observability need separate controls.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Budget units&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Paid-AI guards cap requests and tokens—not currency. No provider-price-normalized $/document forecast is stored.&lt;/td&gt;&lt;td&gt;Hard technical ceilings prevent runaway volume but do not answer unit economics; viability planning still needs cost attribution.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Cost automation&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Auto-refine, paid AI, and paid resume are on; request ceilings are 600/hour and 6,000/day. Legacy auto-resweep is off.&lt;/td&gt;&lt;td&gt;New ingestion deepens automatically within hard ceilings; older enrichment generations will not self-upgrade while re-sweep remains off.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Test coverage&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Main Pool Studio tests do not cover a complete choose → inspect → commit journey; smart-site restoration/polling tests are materially stronger.&lt;/td&gt;&lt;td&gt;The most important viability gap is regression confidence across the full user-visible ingestion journey.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;contextos-ingestion-graph&#x27;);
  if (!root) return;

  const stages = [
    {
      id: &#x27;source&#x27;, number: &#x27;01&#x27;, title: &#x27;Source selection&#x27;, phase: &#x27;Studio preparation&#x27;, status: &#x27;Local draft · no write&#x27;,
      summary: &#x27;The Add workspace identifies what kind of material is entering the funnel and keeps the draft local until you prepare it.&#x27;,
      actions: [
        &#x27;Choose browser files or a folder, pasted text, readable web pages, or linked web files.&#x27;,
        &#x27;Read browser text locally and retain source-specific draft state per library.&#x27;,
        &#x27;Route web sources through acquisition; send local files and paste directly to intake validation.&#x27;
      ],
      settings: [
        [&#x27;Default mode&#x27;, &#x27;Files or folder&#x27;],
        [&#x27;Default web task&#x27;, &#x27;Readable pages&#x27;],
        [&#x27;Default link depth&#x27;, &#x27;UI says depth 1 = supplied pages only; crawler currently follows one linked level&#x27;],
        [&#x27;File ceiling&#x27;, &#x27;4,000 files · 5 MiB each · 100 MiB total&#x27;],
        [&#x27;Supported browser text&#x27;, &#x27;Markdown, text, CSV/TSV, JSON/YAML, HTML/XML, code and SQL&#x27;],
        [&#x27;Draft state&#x27;, &#x27;contextos:pool-studio:&lt;libraryId&gt; · version 1&#x27;]
      ],
      output: &#x27;A source-specific local request ready for validation. No document, library link, index, or model call exists yet.&#x27;,
      branch: &#x27;Web URLs go to stage 02. Local files, folders, and pasted text bypass stage 02 and go directly to stage 03.&#x27;
    },
    {
      id: &#x27;acquire&#x27;, number: &#x27;02&#x27;, title: &#x27;Web acquisition&#x27;, phase: &#x27;Studio preparation&#x27;, status: &#x27;Conditional · network-bound&#x27;,
      summary: &#x27;Web input becomes readable local material through either a bounded page crawler or a reviewed linked-file discovery job.&#x27;,
      actions: [
        &#x27;Fetch supplied pages, remove navigation, ads, popups, and cookie text, and follow only the selected depth.&#x27;,
        &#x27;Discover linked document candidates first, pause for human selection, then download only approved candidates.&#x27;,
        &#x27;For smart-site discovery, optionally ask the configured knowledge model to rank semantic candidates inside the deterministic candidate set.&#x27;,
        &#x27;Enforce robots directives, redirects, crawl scope, host pacing, archive limits, and artifact generations.&#x27;
      ],
      settings: [
        [&#x27;Direct pages&#x27;, &#x27;Per seed URL: depth 1 → 10 pages; depth 2 → 20 pages&#x27;],
        [&#x27;Depth contract&#x27;, &#x27;Crawler follows links while level &lt; depth; this conflicts with the UI depth-1 label&#x27;],
        [&#x27;Direct-page scope&#x27;, &#x27;sameDomain=true · clean_mode=standard&#x27;],
        [&#x27;Linked-file scope&#x27;, &#x27;Section by default; page / section / site available&#x27;],
        [&#x27;Linked-file defaults&#x27;, &#x27;Depth 6 · UI page limit 250 · file limit 1,000&#x27;],
        [&#x27;Linked-file bounds&#x27;, &#x27;Depth 0–12 · pages 1–500 · files 1–2,000&#x27;],
        [&#x27;Linked-file network defaults&#x27;, &#x27;Robots enabled but switchable off · include external/CDN files=true&#x27;],
        [&#x27;Smart-site candidate ranking&#x27;, &#x27;Deterministic boundaries first · optional knowledgeAdvisor proposal · deterministic fallback + human review&#x27;],
        [&#x27;Server pacing&#x27;, &#x27;180 ms host delay · defaults discovery 3/download 1 · maxima 6/4&#x27;]
      ],
      output: &#x27;Clean page text or a versioned downloaded-file artifact plus a source receipt. Direct-page failure can currently become a synthetic “scraper unavailable” document.&#x27;,
      branch: &#x27;Out-of-scope redirects and robots-disallowed paths are rejected when those controls apply. If no direct page survives, the route currently fabricates placeholder text and continues instead of failing.&#x27;
    },
    {
      id: &#x27;guard&#x27;, number: &#x27;03&#x27;, title: &#x27;Intake guard&#x27;, phase: &#x27;Studio preparation&#x27;, status: &#x27;Blocking · must pass&#x27;,
      summary: &#x27;The Studio API rejects unsafe, empty, unsupported, or oversized input before creating a batch.&#x27;,
      actions: [
        &#x27;Cap submissions, reject empty text, normalize path separators, and remove dot or parent-directory segments.&#x27;,
        &#x27;Scan server folders for ingestible files and report binary, skipped, or truncated content.&#x27;,
        &#x27;Enter planning with model proposals disabled so Add preparation remains deterministic and local.&#x27;
      ],
      settings: [
        [&#x27;API JSON body ceiling&#x27;, &#x27;150 MiB&#x27;],
        [&#x27;General API limiter&#x27;, &#x27;300 authenticated requests/minute&#x27;],
        [&#x27;Browser /intake/files&#x27;, &#x27;Maximum 4,000 files · 5 MiB each · 100 MiB aggregate&#x27;],
        [&#x27;Paste boundary&#x27;, &#x27;150 MiB Express JSON body ceiling · no separate 100 MiB batch cap&#x27;],
        [&#x27;Workspace-folder boundary&#x27;, &#x27;Maximum 4,000 files · 5 MiB each · no aggregate byte ceiling&#x27;],
        [&#x27;Planning model&#x27;, &#x27;disableLlm=true for files, folders, paste, and direct web&#x27;],
        [&#x27;Folder exclusions&#x27;, &#x27;node_modules, .git, dist, build, .next, coverage, vendor, virtualenvs, __pycache__&#x27;],
        [&#x27;Workspace trust boundary&#x27;, &#x27;Configured STUDIO_FS_ROOTS · directory symlinks skipped · supported file symlinks can currently escape the root · ignores honored&#x27;]
      ],
      output: &#x27;A sanitized FunnelInput list with origin, MIME type, raw text, batch label, and accepted/skipped counts.&#x27;,
      branch: &#x27;No readable input returns 400 and writes no batch. Valid input continues to stage 04.&#x27;
    },
    {
      id: &#x27;extract&#x27;, number: &#x27;04&#x27;, title: &#x27;Envelope and extraction&#x27;, phase: &#x27;Studio preparation&#x27;, status: &#x27;Deterministic batch stage&#x27;,

    { from: &#x27;fast&#x27;, to: &#x27;refine&#x27;, label: &#x27;debounce&#x27;, labelDx: -26, labelDy: 20, mobileRoute: &#x27;right&#x27;, mobileRail: 3, mobileLabelHide: true },
    { from: &#x27;enrich&#x27;, to: &#x27;intelligence&#x27;, label: &#x27;complete&#x27; },
    { from: &#x27;enrich&#x27;, to: &#x27;synthesize&#x27;, label: &#x27;document ready&#x27;, mobileRoute: &#x27;left&#x27;, mobileLabelHide: true },
    { from: &#x27;enrich&#x27;, to: &#x27;refine&#x27;, label: &#x27;complete event&#x27;, mobileRoute: &#x27;right&#x27;, mobileLabelHide: true },
    { from: &#x27;existing&#x27;, to: &#x27;synthesize&#x27;, label: &#x27;reused document&#x27;, labelDx: -28, labelDy: -18, mobileRoute: &#x27;left&#x27;, mobileRail: 2, mobileLabelHide: true },
    { from: &#x27;intelligence&#x27;, to: &#x27;complete&#x27;, label: &#x27;knowledge objects&#x27;, mobileRoute: &#x27;left&#x27;, mobileLabelHide: true },
    { from: &#x27;synthesize&#x27;, to: &#x27;complete&#x27;, label: &#x27;corpus brief + gaps&#x27;, mobileRoute: &#x27;right&#x27;, mobileLabelHide: true },
    { from: &#x27;refine&#x27;, to: &#x27;complete&#x27;, label: &#x27;refined architecture&#x27; }
  ];

  const canvas = root.querySelector(&#x27;.graph-canvas&#x27;);
  const svg = root.querySelector(&#x27;#ingestion-graph-edges&#x27;);
  const edgeLayer = root.querySelector(&#x27;#ingestion-edge-layer&#x27;);
  const buttons = Array.from(root.querySelectorAll(&#x27;button[data-stage-id]&#x27;));
  const detailPanel = root.querySelector(&#x27;.graph-detail&#x27;);
  const phase = root.querySelector(&#x27;#ingestion-detail-phase&#x27;);
  const title = root.querySelector(&#x27;#ingestion-detail-title&#x27;);
  const status = root.querySelector(&#x27;#ingestion-detail-status&#x27;);
  const summary = root.querySelector(&#x27;#ingestion-detail-summary&#x27;);
  const actions = root.querySelector(&#x27;#ingestion-detail-actions&#x27;);
  const approach = root.querySelector(&#x27;#ingestion-detail-approach&#x27;);
  const settings = root.querySelector(&#x27;#ingestion-detail-settings&#x27;);
  const output = root.querySelector(&#x27;#ingestion-detail-output&#x27;);
  const branch = root.querySelector(&#x27;#ingestion-detail-branch&#x27;);
  const runtime = root.querySelector(&#x27;#ingestion-detail-runtime&#x27;);
  const modules = root.querySelector(&#x27;#ingestion-detail-modules&#x27;);
  const tools = root.querySelector(&#x27;#ingestion-detail-tools&#x27;);
  const artifacts = root.querySelector(&#x27;#ingestion-detail-artifacts&#x27;);
  const resilience = root.querySelector(&#x27;#ingestion-detail-resilience&#x27;);
  const decisions = root.querySelector(&#x27;#ingestion-detail-decisions&#x27;);
  const detailTabs = Array.from(root.querySelectorAll(&#x27;[data-detail-tab]&#x27;));
  const detailPanels = Array.from(root.querySelectorAll(&#x27;[data-detail-panel]&#x27;));
  let selectedId = &#x27;source&#x27;;

  const nodeRect = id =&gt; {
    const node = root.querySelector(`[data-node-id=&quot;${id}&quot;]`);
    if (!node) return null;
    const nodeBox = node.getBoundingClientRect();
    const canvasBox = canvas.getBoundingClientRect();
    return {
      left: nodeBox.left - canvasBox.left,
      right: nodeBox.right - canvasBox.left,
      top: nodeBox.top - canvasBox.top,
      bottom: nodeBox.bottom - canvasBox.top,
      width: nodeBox.width,
      height: nodeBox.height,
      cx: nodeBox.left - canvasBox.left + nodeBox.width / 2,
      cy: nodeBox.top - canvasBox.top + nodeBox.height / 2
    };
  };

  const edgeGeometry = (from, to, edge) =&gt; {
    const narrow = canvas.clientWidth &lt;= 520;
    const routedSide = narrow ? edge.mobileRoute : edge.route;
    if (routedSide) {
      const leftRoute = routedSide === &#x27;left&#x27;;
      const railOffset = Number(narrow ? edge.mobileRail || 0 : edge.rail || 0) * 6;
      const sx = leftRoute ? from.left : from.right;
      const tx = leftRoute ? to.left : to.right;
      const sy = from.cy;
      const ty = to.cy;
      const railX = leftRoute
        ? Math.max(4, Math.min(from.left, to.left) - 12 - railOffset)
        : Math.min(canvas.clientWidth - 4, Math.max(from.right, to.right) + 12 + railOffset);
      return {
        path: `M ${sx} ${sy} C ${railX} ${sy}, ${railX} ${ty}, ${tx} ${ty}`,
        labelX: railX,
        labelY: (sy + ty) / 2
      };
    }

    const nearlyHorizontal = Math.abs(to.cy - from.cy) &lt; Math.max(from.height, to.height);
    if (nearlyHorizontal) {
      const leftToRight = from.cx &lt; to.cx;
      const sx = leftToRight ? from.right : from.left;
      const tx = leftToRight ? to.left : to.right;
      const sy = from.cy;
      const ty = to.cy;
      const mx = (sx + tx) / 2;
      return {
        path: `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`,
        labelX: mx,
        labelY: (sy + ty) / 2 - 8
      };
    }

    const sx = from.cx;
    const sy = from.bottom;
    const tx = to.cx;
    const ty = to.top;
    const my = sy + (ty - sy) / 2;
    return {
      path: `M ${sx} ${sy} C ${sx} ${my}, ${tx} ${my}, ${tx} ${ty}`,
      labelX: (sx + tx) / 2,
      labelY: my - 7
    };
  };

  const updateEdgeSelection = () =&gt; {
    const activeNodes = new Set([selectedId]);
    const activeEdges = new Set();
    let changed = true;
    while (changed) {
      changed = false;
      edges.forEach((edge, index) =&gt; {
        if (!activeNodes.has(edge.to)) return;
        activeEdges.add(index);
        if (!activeNodes.has(edge.from)) {
          activeNodes.add(edge.from);
          changed = true;
        }
      });
    }

    edgeLayer.querySelectorAll(&#x27;[data-edge-index]&#x27;).forEach(element =&gt; {
      const active = activeEdges.has(Number(element.dataset.edgeIndex));
      element.classList.toggle(&#x27;is-active&#x27;, active);
      if (element.tagName.toLowerCase() === &#x27;path&#x27;) {
        element.setAttribute(&#x27;marker-end&#x27;, active ? &#x27;url(#ingestion-arrow-active)&#x27; : &#x27;url(#ingestion-arrow)&#x27;);
      }
    });
  };

  const drawEdges = () =&gt; {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    edgeLayer.replaceChildren();

    edges.forEach((edge, index) =&gt; {
      const from = nodeRect(edge.from);
      const to = nodeRect(edge.to);
      if (!from || !to) return;
      const geometry = edgeGeometry(from, to, edge);

      const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
      path.setAttribute(&#x27;d&#x27;, geometry.path);
      path.setAttribute(&#x27;class&#x27;, edge.mobileHide ? &#x27;edge mobile-hide&#x27; : &#x27;edge&#x27;);
      path.setAttribute(&#x27;marker-end&#x27;, &#x27;url(#ingestion-arrow)&#x27;);
      path.dataset.edgeIndex = String(index);
      edgeLayer.appendChild(path);

      const label = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
      label.setAttribute(&#x27;x&#x27;, String(geometry.labelX + Number(edge.labelDx || 0)));
      label.setAttribute(&#x27;y&#x27;, String(geometry.labelY + Number(edge.labelDy || 0)));
      label.setAttribute(
        &#x27;class&#x27;,
        `edge-label${edge.mobileHide ? &#x27; mobile-hide&#x27; : &#x27;&#x27;}${edge.mobileLabelHide ? &#x27; mobile-hide&#x27; : &#x27;&#x27;}`
      );
      label.dataset.edgeIndex = String(index);
      label.textContent = edge.label;
      edgeLayer.appendChild(label);
    });

    updateEdgeSelection();
  };

  const replaceList = (element, items) =&gt; {
    element.replaceChildren(...items.map(item =&gt; {
      const li = document.createElement(&#x27;li&#x27;);
      li.textContent = item;
      return li;
    }));
  };

  const replaceSettings = items =&gt; {
    const nodes = [];
    items.forEach(([label, value]) =&gt; {
      const term = document.createElement(&#x27;dt&#x27;);
      const detail = document.createElement(&#x27;dd&#x27;);
      term.textContent = label;
      detail.textContent = value;
      nodes.push(term, detail);
    });
    settings.replaceChildren(...nodes);
  };

  const replaceCodeList = (element, items) =&gt; {
    element.replaceChildren(...items.map(item =&gt; {
      const li = document.createElement(&#x27;li&#x27;);
      const code = document.createElement(&#x27;code&#x27;);
      code.textContent = item;
      li.appendChild(code);
      return li;
    }));
  };

  const showDetailTab = tabId =&gt; {
    detailTabs.forEach(tab =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.dataset.detailTab === tabId)));
    detailPanels.forEach(panel =&gt; { panel.hidden = panel.dataset.detailPanel !== tabId; });
  };

  const showStage = stageId =&gt; {
    const stage = stages.find(candidate =&gt; candidate.id === stageId);
    const detail = implementation[stageId];
    if (!stage || !detail) return;
    selectedId = stageId;
    buttons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.stageId === stageId)));
    phase.textContent = stage.phase;
    title.textContent = `${stage.number} · ${stage.title}`;
    status.textContent = stage.status;
    summary.textContent = stage.summary;
    replaceList(actions, stage.actions);
    replaceList(approach, detail.approach);
    replaceSettings(stage.settings);
    output.textContent = stage.output;
    branch.textContent = stage.branch;
    runtime.textContent = detail.runtime;
    replaceCodeList(modules, detail.modules);
    replaceList(tools, detail.tools);
    replaceList(artifacts, detail.artifacts);
    replaceList(resilience, detail.resilience);
    replaceList(decisions, detail.decisions);
    detailPanel.scrollTop = 0;
    updateEdgeSelection();
  };

  buttons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showStage(button.dataset.stageId)));
  detailTabs.forEach(tab =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; showDetailTab(tab.dataset.detailTab)));
  showDetailTab(&#x27;flow&#x27;);
  showStage(&#x27;source&#x27;);
  requestAnimationFrame(drawEdges);

  if (typeof ResizeObserver === &#x27;function&#x27;) {
    const observer = new ResizeObserver(() =&gt; requestAnimationFrame(drawEdges));
    observer.observe(canvas);
  } else {
    window.addEventListener(&#x27;resize&#x27;, drawEdges);
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
